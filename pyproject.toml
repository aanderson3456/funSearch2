[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "funsearch-scratch"
version = "0.2.0"
description = "FunSearch: Mathematical Discoveries from Program Search with Large Language Models"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "DeepMind & Open-Source Contributors" }
]
dependencies = [
    "google-genai>=2.0.0",
    "google-generativeai>=0.8.0",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "absl-py>=2.0.0",
]

[project.scripts]
funsearch = "funsearch.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
